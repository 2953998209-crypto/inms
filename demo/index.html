<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>库存进销存看板（演示系统）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="lib/chart.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
body::before {
  content: "【演示数据·仅供体验】";
  position: fixed; top: 5px; left: 50%; transform: translateX(-50%);
  background: #d32f2f; color: #fff; padding: 6px 24px; border-radius: 20px;
  font-size: 13px; z-index: 9999; font-weight: bold;
  box-shadow: 0 2px 10px rgba(211,47,47,0.5);
}
.topbar { padding-top: 35px; }
</style>
</head>
<body>
<div id="loader"><div class="spin"></div><p>正在加载演示数据…</p></div>

<header class="topbar">
  <div class="brand">
    <span class="logo">📦</span>
    <div>
      <h1>库存进销存智能管理看板</h1>
      <small id="orgName">湖北盐业集团荆州分公司（演示）</small>
    </div>
  </div>
  <div class="topctl">
    <select id="periodSel" title="统计期间"></select>
    <span id="syncBadge" class="badge" style="background:#ff9800">演示模式</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="overview" class="on">总览</button>
  <button data-tab="stock">库存管理</button>
  <button data-tab="sales">销售汇总</button>
  <button data-tab="staff">业务员分析</button>
  <button data-tab="forecast">预测分析</button>
  <button data-tab="year">年度汇总</button>
  <button data-tab="upload">数据上传</button>
</nav>

<main>
<!-- 总览 -->
<section id="tab-overview" class="tab on">
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card"><h3>各品类销量占比</h3><div class="cbox"><canvas id="chCatPie"></canvas></div></div>
    <div class="card"><h3>月度销量趋势</h3><div class="cbox"><canvas id="chTrend"></canvas></div></div>
  </div>
  <div class="card">
    <h3>库存预警 <span id="warnCount" class="badge" style="background:#f44336">0</span></h3>
    <table class="dt"><thead><tr><th>产品</th><th>分类</th><th>库存量</th><th>状态</th></tr></thead><tbody id="warnList"></tbody></table>
  </div>
</section>

<!-- 库存管理 -->
<section id="tab-stock" class="tab">
  <div class="card">
    <h3>库存产品台账</h3>
    <table class="dt"><thead><tr><th>产品名称</th><th>分类</th><th>单位</th><th>库存量</th><th>仓库</th><th>状态</th></tr></thead><tbody id="stockBody"></tbody></table>
  </div>
</section>

<!-- 销售汇总 -->
<section id="tab-sales" class="tab">
  <div class="card">
    <h3>商品销售汇总</h3>
    <table class="dt"><thead><tr><th>产品名称</th><th>分类</th><th>单位</th><th>销量</th><th>金额</th><th>仓库</th></tr></thead><tbody id="salesBody"></tbody></table>
  </div>
</section>

<!-- 业务员分析 -->
<section id="tab-staff" class="tab">
  <div class="card">
    <h3>业务员销量排名</h3>
    <table class="dt"><thead><tr><th>排名</th><th>业务员</th><th>销量（吨）</th><th>金额</th></tr></thead><tbody id="staffBody"></tbody></table>
  </div>
</section>

<!-- 预测分析 -->
<section id="tab-forecast" class="tab">
  <div class="grid2">
    <div class="card">
      <h3>下月销量预测</h3>
      <div class="cbox"><canvas id="chForecast"></canvas></div>
      <p id="forecastTip" style="margin-top:10px;color:#90caf9;font-size:13px;"></p>
    </div>
    <div class="card">
      <h3>备货建议</h3>
      <div style="padding:20px;color:#b0bec5;">
        <p>✅ 根据历史趋势预测下月需求</p>
        <p>✅ 低库存产品建议提前补货</p>
        <p>✅ 呆滞积压产品建议促销处理</p>
      </div>
    </div>
  </div>
</section>

<!-- 年度汇总 -->
<section id="tab-year" class="tab">
  <div class="card">
    <h3>年度进销存汇总</h3>
    <table class="dt"><thead><tr><th>期间</th><th>销量（吨）</th><th>销售金额</th><th>购进量（吨）</th></tr></thead><tbody id="yearBody"></tbody></table>
  </div>
</section>

<!-- 数据上传 -->
<section id="tab-upload" class="tab">
  <div class="card">
    <h3>Excel 数据上传（演示版不支持上传）</h3>
    <div id="uploadLog" class="log" style="min-height:200px;padding:20px;"></div>
  </div>
</section>
</main>

<div id="toast"></div>
<script src="app_demo.js"></script>
</body>
</html>
